[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-mv3dt"
version = "0.1.0"
description = "Workspace tools for DeepStream Multi-View 3D Tracking on a 4-camera basketball court"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
